<!-- 1) React 18.3.1 + ReactDOM 18.3.1 (UMD).
     Primary source: vendor/react-magi-umd.js — carved verbatim out of the DSH web shell
     bundle inside app.asar, so it needs no network at any point.
     Fallback: if that file is ever replaced by a plain react/react-dom UMD pair
     (see tools/fetch-preview-react.mjs), load it here instead. -->
<script src="./vendor/react-magi-umd.js"></script>
<script>
  // Accept either vendoring shape: the single carved bundle, or a
  // react + react-dom UMD pair placed side by side by the host tooling.
  if (typeof window.React !== "object" || window.React === null) {
    document.write('<script src="./vendor/react.production.min.js"><\/script>');
    document.write('<script src="./vendor/react-dom.production.min.js"><\/script>');
  }
  if (typeof window.React !== "undefined" && window.React.React !== undefined) {
    // The carved bundle exposes { React, ReactDOM }; the UMD pair exposes them directly.
    window.ReactDOM = window.React.ReactDOM;
    window.React = window.React.React;
  }
</script>

<!-- 2) Fake host: module loader + slots context + fetch/EventSource shims -->
<script>
(function () {
  "use strict";

  var logNode = document.getElementById("demo-log");
  function escapeHtml(text) {
    return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function log(text) {
    var line = document.createElement("div");
    // Callers pass a few deliberate <b> markers; escape everything else.
    line.innerHTML = "<b>" + new Date().toISOString().slice(11, 23) + "</b>  " +
      escapeHtml(text).replace(/&lt;b&gt;/g, "<b>").replace(/&lt;\/b&gt;/g, "</b>");
    logNode.appendChild(line);
    logNode.scrollTop = logNode.scrollHeight;
    while (logNode.childNodes.length > 400) logNode.removeChild(logNode.firstChild);
  }

  var uiConfig = { crtEffects: true, sound: false };
  window.__magiConfig = { ui: uiConfig };

  // ---- require shim: only React is external -------------------------------
  window.__magiRequire = function (id) {
    if (id === "react") return window.React.React;
    if (id === "react-dom" || id === "react-dom/client") return window.React.ReactDOM;
    throw new Error("preview require shim: unexpected module '" + id + "'");
  };

  var registrations = [];
  window.__magiRegistrations = registrations;

  function fakeContext() {
    return {
      // A stand-in for the client root's `layout` service, so the panel's
      // "转到主视图" button is exercised instead of being hidden.
      layout: {
        selectPanel: function (name) { log("ctx.layout.selectPanel(<b>" + name + "</b>)"); }
      },
      slots: {
        inject: function (name, fn) {
          log("ctx.slots.inject(<b>" + name + "</b>)");
          fn();
        },
        register: function (opts, Comp) {
          registrations.push({ opts: opts, Comp: Comp });
          log("ctx.slots.register({ name: <b>" + opts.name + "</b>, key: <b>" + String(opts.key) + "</b> }) → " + (Comp && (Comp.name || "anonymous")));
          return function () { log("dispose " + opts.name + "/" + opts.key); };
        }
      }
    };
  }

  // ---- EventSource shim: scripted frames, one instance per panel ----------
  var streams = [];
  function FakeEventSource(url) {
    var self = this;
    this.url = url;
    this.closed = false;
    this.listeners = { message: [], open: [], error: [] };
    streams.push(this);
    setTimeout(function () { if (!self.closed) self.emit("open", {}); }, 0);
  }
  FakeEventSource.prototype.addEventListener = function (type, fn) {
    if (this.listeners[type] === undefined) this.listeners[type] = [];
    this.listeners[type].push(fn);
  };
  FakeEventSource.prototype.removeEventListener = function (type, fn) {
    var list = this.listeners[type] || [];
    var index = list.indexOf(fn);
    if (index !== -1) list.splice(index, 1);
  };
  FakeEventSource.prototype.close = function () { this.closed = true; };
  FakeEventSource.prototype.emit = function (type, event) {
    var list = (this.listeners[type] || []).slice();
    for (var i = 0; i < list.length; i += 1) list[i](event);
  };
  FakeEventSource.prototype.frame = function (payload) {
    if (this.closed) return;
    this.emit("message", { data: JSON.stringify(payload) });
  };
  window.EventSource = FakeEventSource;

  // ---- fetch shim --------------------------------------------------------
  window.fetch = function (url, init) {
    var method = (init && init.method) || "GET";
    log("fetch <b>" + method + "</b> " + url);
    if (String(url).indexOf("/magi/api/history") === 0) {
      return Promise.resolve({ ok: true, status: 200, json: function () { return Promise.resolve({ items: [window.__magiScenario.normal.result] }); } });
    }
    if (String(url).indexOf("/magi/api/vote") === 0) {
      var body = {};
      try { body = JSON.parse((init && init.body) || "{}"); } catch (error) { body = {}; }
      var id = "MAGI-DECISION No.0099";
      window.__magiManual = { id: id, question: body.question, criticality: body.criticality || "normal" };
      return Promise.resolve({
        ok: true, status: 200,
        json: function () { return Promise.resolve({ id: id, startedAt: new Date().toISOString(), criticality: body.criticality || "normal", criticalitySource: "explicit" }); }
      });
    }
    return Promise.resolve({ ok: false, status: 404, json: function () { return Promise.resolve({}); } });
  };

  // ---- fake React JSX-free module loader ---------------------------------
  window.__magiModule = null;
  window.__ModuleLoader__ = {
    load: function (descriptor) {
      log("__ModuleLoader__.load({ id: <b>" + descriptor.id + "</b> })");
      window.__magiModule = descriptor.factory(window.__magiRequire);
    }
  };

  window.__magiBoot = function () {
    var mod = window.__magiModule;
    if (mod === null || mod === undefined) throw new Error("client.js was not loaded");
    log("exports.inject = " + JSON.stringify(mod.inject));
    mod.apply(fakeContext());
    return registrations;
  };
  window.__magiLog = log;
})();
</script>

      opinions: [
        {

          key_factors: ["泄露可复现", "轮换窗口 30 分钟", "双密钥共存可回退"],
          risks: ["下游 14 个服务逐个改配可能漏项"],
          caveats: "需要在轮换前导出一次凭证清单做交叉核对。",
          latencyMs: 2410, tokens: { input: 845, output: 288 }
        },
        {
          unit: "BALTHASAR-2", stance: "reject", confidence: 0.91,
          reason: "十四处下游里只要有一处没接住新凭证，那条业务链会整段停摆，而停摆期间的用户请求不会等待我们修好。不可逆的不是密钥，是那段时间里没有被人处理的请求。我反对立即执行。",
          key_factors: ["14 处下游无法逐个人工确认", "停摆影响真实用户", "无二次确认窗口"],
          risks: ["业务链整段停摆", "受影响用户事后才知情"],
          caveats: "如果分批且每批之间有验证间隔，我会改投赞成。",
          latencyMs: 3020, tokens: { input: 861, output: 322 }
        },
        {
          unit: "CASPER-3", stance: "approve", confidence: 0.55,
          reason: "被泄露这件事让我很不舒服，我不想在这上面赌运气。赶紧换掉，我宁愿承担一次手忙脚乱，也不想在几天后听到坏消息。",
          key_factors: ["对泄露的主观不安", "拖延带来的心理成本"],
          risks: ["匆忙操作本身可能制造新故障"],
          caveats: "我承认这条判断里情绪成分很高。",
          latencyMs: 1870, tokens: { input: 802, output: 198 }
        }
      ],
      tally: { approve: 2, reject: 1 },
      verdict: "VETO",
      unanimity: false,
      confidenceAvg: 0.78,
      elapsedMs: 7640,
      notes: ["critical 档：任一拒否即否決，2:1 多数不生效。", "BALTHASAR-2 要求分批轮换并留验证间隔。"]

  }

  var scenarioFrom = {
    normal: { result: resultNormal() },
    critical: { result: resultCritical() },
  };
  window.__magiScenario = scenarioFrom;

  var DURATIONS = { melchior: 2600, balthasar: 3400, casper: 2400 };

  function tolerantResult(partial) {
    return {
      id: partial.id, createdAt: partial.createdAt, question: partial.question,
      context: partial.context, criticality: partial.criticality,
      criticalitySource: partial.criticalitySource, matchedKeywords: partial.matchedKeywords,
      opinions: partial.opinions, tally: partial.tally, verdict: partial.verdict,
      unanimity: partial.unanimity, confidenceAvg: partial.confidenceAvg,
      elapsedMs: partial.elapsedMs, notes: partial.notes
    };
  }

  function criticalityOf(source) { return source === "keyword" ? "critical" : "normal"; }

  /**
   * Drive one fake SSE stream through the exact frame vocabulary documented for
   * GET /magi/api/events: vote → unit(analyzing) → unit-delta… → unit(output) →
   * unit-done → verdict.
   */
  function playScenario(stream, result, speed, done) {
    var name = result.id;
    var source = result.criticalitySource;
    var timers = [];
    function at(ms, fn) { timers.push(setTimeout(fn, ms / speed)); }
    var start = Date.now();

    at(0, function () {
      stream.frame({
        type: "vote", id: name, question: result.question,
        criticality: criticalityOf(source), criticalitySource: source,
        matchedKeywords: result.matchedKeywords || [], startedAt: new Date().toISOString()
      });
      log("SSE <b>vote</b> " + name + " criticality=" + criticalityOf(source));
    });

    var order = ["melchior", "balthasar", "casper"];
    var total = 0;
    order.forEach(function (key, unitIndex) {
      var opinion = result.opinions[unitIndex];
      var unitName = opinion.unit;
      var duration = DURATIONS[key];
      var charMs = duration / opinion.reason.length;
      at(120 + unitIndex * 90, function () {
        stream.frame({ type: "unit", id: name, unit: unitName, state: "analyzing" });
        log("SSE <b>unit</b> " + unitName + " analyzing");
      });
      var chars = 0;
      for (var ms = 260 + unitIndex * 90; ms <= 260 + unitIndex * 90 + duration; ms += 55) {
        var take = Math.max(1, Math.round(55 / charMs));
        chars = Math.min(opinion.reason.length, chars + take);
        var slice = opinion.reason.slice(chars - take, chars);
        at(ms, function () { stream.frame({ type: "unit-delta", id: name, unit: unitName, text: slice }); });
      }
      at(300 + unitIndex * 90 + duration, function () {
        stream.frame({ type: "unit", id: name, unit: unitName, state: "output" });
      });
      at(340 + unitIndex * 90 + duration, function () {
        stream.frame({ type: "unit-done", id: name, unit: unitName, opinion: opinion });
        log("SSE <b>unit-done</b> " + unitName + " → " + opinion.stance);
      });
      total = Math.max(total, 340 + unitIndex * 90 + duration);
    });

    at(total + 260, function () {
      stream.frame({ type: "verdict", id: name, result: tolerantResult(result) });
      log("SSE <b>verdict</b> " + name + " → " + result.verdict);
      if (typeof done === "function") done();
    });
    return timers;
  }

  /* ----------------------------- mounting ------------------------------- */
  var root = document.getElementById("demo-root");

  /** Mount a fresh MagiPanel instance into `host` using a real ReactDOM root. */
  function mountPanel(host, Comp, seed) {
    if (host === null) return;
    if (host.__magiRoot !== undefined) { try { host.__magiRoot.unmount(); } catch (error) { /* ignore */ } }
    host.__magiRoot = ReactDOM.createRoot(host);
    // `ui` mirrors the plugin config; `initialResult` seeds the board so the three units
    // exist before the scripted SSE stream starts typing into them.
    host.__magiRoot.render(h(Comp, { ui: window.__magiConfig.ui, initialResult: seed }, null));
  }

  var App = function () {
    // `__magiBoot` runs the *real* exports.apply(fakeContext()), so the slot
    // registrations come from lib/client.js itself.
    var registrations = window.__magiBoot();
    var panelEntry = registrations.filter(function (entry) { return entry.opts.name === "main"; })[0];

    var criticalResult = scenarioFrom.critical.result;

    return h("div", null,
      h("div", { className: "demo-section" }, "1 · main 槽位：MagiPanel × 2（普通 2:1 承認 / critical 否決），假 SSE 逐字打印"),

        ),
        h("div", { className: "demo-frame" },
          h("div", { className: "demo-frame-label" }, "SCENARIO B · critical · 2:1 → 否決 (VETO)"),
          h("div", { ref: hosts[1] })
        )
      ),
      h("div", { className: "demo-section" }, "2 · tool.call.toolview 槽位：MagiVoteCard（key = magi_vote），输入为宿主半返回的 block.text"),

          h("div", { className: "demo-frame-label" }, "block.text = JSON.stringify(normal MagiResult)"),
          h(cardEntry.Comp, { toolName: "magi_vote", block: { type: "text", text: JSON.stringify(normalResult, null, 2) } }, null)
        ),
        h("div", { className: "demo-frame" },
          h("div", { className: "demo-frame-label" }, "block.text = JSON.stringify(critical VETO MagiResult)"),
          h(cardEntry.Comp, { toolName: "magi_vote", block: { type: "text", text: JSON.stringify(criticalResult, null, 2) } }, null)
        ),
        h("div", { className: "demo-frame" },
          h("div", { className: "demo-frame-label" }, "block.text = 非 JSON（回退为原文显示，不抛错）"),
          h(cardEntry.Comp, { toolName: "magi_vote", block: { type: "text", text: "MELCHIOR-1: APPROVE\nBALTHASAR-2: REJECT\nCASPER-3: APPROVE\nVOTE 2:1 → APPROVE" } }, null)
        )
      ),
      h("p", { className: "demo-note" }, "提示：面板内「跳过动画」可立即铺满当前单元文本；底部输入区 Enter 会走假 fetch /magi/api/vote。")
    );
  };

  function mount() {
    var host = document.getElementById("demo-root");
    if (window.__demoRoot !== undefined && window.__demoRoot !== null) {
      try { window.__demoRoot.unmount(); } catch (error) { /* ignore */ }
    }
    window.__demoRoot = ReactDOM.createRoot(host);
    window.__demoRoot.render(h(App, null, null));
  }

  function replay() {
    log("──────── replay ────────");
    streams.slice().forEach(function (stream) { stream.close(); });
    streams.length = 0;
    mount();
    setTimeout(function () {
      if (streams.length >= 2) {
        playScenario(streams[0], scenarioFrom.normal.result, 1);
        playScenario(streams[1], scenarioFrom.critical.result, 1);
      } else {
        log("ERROR: expected two EventSource instances, got " + streams.length);
      }
    }, 60);
  }

  document.getElementById("demo-replay").addEventListener("click", replay);
  var soundButton = document.getElementById("demo-sound");
  soundButton.addEventListener("click", function () {
    window.__magiConfig.ui.sound = window.__magiConfig.ui.sound !== true;
    soundButton.textContent = "音效（ui.sound）：" + (window.__magiConfig.ui.sound === true ? "开" : "关");
    log("ui.sound = " + window.__magiConfig.ui.sound);
  });

  window.__magiReplay = replay;
  replay();
})();
</script>
</body>
</html>
